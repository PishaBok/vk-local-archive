name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
        include:
          - os: ubuntu-latest
            python: '3.9'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test without VK credentials
        run: python -B -m unittest discover -s tests -v
      - name: Check commands
        run: |
          python download.py --help
          python view.py --help
      - name: Check installable package
        run: python -m pip install --no-deps .
      - name: Check installed entry points
        run: |
          vk-archive-download --help
          vk-archive-view --help
